<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhereAreYou AI - 소재 파악기</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <div class="logo">WhereAreYou AI</div>
        <ul>
            <li><a href="#home">Home</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#tracker">Tracker</a></li>
        </ul>
    </nav>

    <section id="home" class="hero">
        <h1>그 사람은 지금 어디에 있을까?</h1>
        <p>AI 위성이 분석하는 운명적 소재 파악</p>
        <button onclick="location.href='#tracker'">지금 추적하기</button>
    </section>

    <section id="about">
        <h2>About Service</h2>
        <p>이름과 생년월일의 파동을 분석하여,<br>AI가 상대방의 현재 상태와 위치를 위트 있게 예측합니다.</p>
    </section>

    <section id="tracker">
        <h2>AI 소재 추적기</h2>
        <div class="input-group">
            <input type="text" id="userName" placeholder="이름 입력">
            <input type="date" id="birthDate">
            <button id="trackBtn">추적 시작</button>
        </div>
        <div id="loading" class="hidden">위성 연결 중...</div>
        <div id="result" class="result-box hidden"></div>
    </section>

    <script src="script.js"></script>
</body>
</html>
